:root {
  --ink: #0e0e0e;
  --paper: #ffffff;
  --pink: #ffb3e0;
  --orange: #ff7d33;
  --lime: #d4ff4f;
  --display: "Unbounded", system-ui, sans-serif;
  --body: "Figtree", system-ui, sans-serif;
  --hand: "Caveat", "Bradley Hand", cursive;
  --gutter: clamp(16px, 3vw, 38px);
  --promo-h: 44px;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--ink); color: var(--paper); font-family: var(--body); }

/* the promotion: its own bar above everything, never part of the headline */
.promo { position: relative; z-index: 3; height: var(--promo-h); display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 var(--gutter); background: var(--lime); color: var(--ink); font-weight: 600; font-size: .98rem; white-space: nowrap; overflow: hidden; }
.promo__tag { font-family: var(--display); font-size: .7rem; font-weight: 700; letter-spacing: .08em; padding: 5px 9px; border: 2px solid var(--ink); border-radius: 999px; background: var(--pink); }
.promo__spot { display: inline-flex; align-items: center; gap: 7px; font-weight: 800; }
.promo__spot i { width: 8px; height: 8px; border-radius: 50%; background: #00933c; animation: pulse 1.6s ease-in-out infinite; }
.promo__regular { opacity: .7; font-weight: 500; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(0,147,60,.55); } 50% { box-shadow: 0 0 0 6px rgba(0,147,60,0); } }
.no-promo .promo { display: none; }
.no-promo { --promo-h: 0px; }

.hero { position: relative; height: calc(100svh - var(--promo-h)); min-height: 560px; overflow: hidden; isolation: isolate; }
.hero__frame { position: absolute; inset: 0; z-index: -2; overflow: hidden; }
/* the slow zoom toward each person's phone (set by the script; Ben: "zooming makes it clear the focus is the phone") */
.hero__zoom { position: absolute; inset: 0; transform-origin: 0 0; background: var(--ink) 70% 50% / cover no-repeat; will-change: transform; }
.hero__video { width: 100%; height: 100%; object-fit: cover; object-position: 70% 50%; display: block; }
/* darkens the left, where the words sit; the people stay bright on the right */
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(90deg, rgba(8,6,10,.82) 0%, rgba(8,6,10,.6) 32%, rgba(8,6,10,0) 62%),
              linear-gradient(0deg, rgba(8,6,10,.45) 0%, rgba(8,6,10,0) 30%); }

.bar { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 28px var(--gutter) 0; }
.bar__logo { height: 31px; width: auto; display: block; }
.bar__menu { width: 34px; height: 34px; display: grid; place-content: center; gap: 6px; }
.bar__menu i { display: block; width: 26px; height: 2.5px; background: var(--paper); border-radius: 2px; }

/* wide enough that the headline takes 3 lines, not 4 (Ben, 2026-10-26) */
.pitch { position: absolute; left: var(--gutter); bottom: clamp(64px, 11vh, 120px); width: min(46vw, 700px); }
.pitch__title { font-family: var(--display); font-weight: 700; font-size: clamp(2.1rem, 3.9vw, 3.9rem); line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
.pitch__sub { margin-top: 20px; font-size: clamp(1.2rem, 1.85vw, 1.75rem); line-height: 1.35; color: rgba(255,255,255,.86); max-width: 30em; text-wrap: balance; } /* balanced: never two words alone on a line (Ben) */
.button { display: inline-block; margin-top: 30px; padding: 17px 28px; font-family: var(--display); font-weight: 600; font-size: 1.02rem; color: var(--ink); background: var(--pink); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 5px 5px 0 var(--orange); text-decoration: none; transition: transform .15s, box-shadow .15s; }
.button:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--orange); }
.button:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--orange); }

/* the texts, floating in the scene beside the phone. Their motion is drawn by the script from the video's own clock,
   so it always matches the picture (and can be recorded frame by frame). */
.texts { --gap: 16px; position: absolute; z-index: 1; width: max-content; max-width: 46vw; display: grid; gap: var(--gap); justify-items: end; perspective: 900px; pointer-events: none; transform: translate(-50%, -100%); }
/* big and narrow (Ben, 2026-10-25); the line breaks are set by hand in each text, two balanced lines, never an orphan
   (Ben, 2026-10-26), so the bubble is only as wide as its longer line */
.text { font-size: clamp(1.7rem, 3vw, 3rem); line-height: 1.12; font-weight: 600; max-width: 12em; white-space: pre-line; text-wrap: balance; padding: .5em .75em; border-radius: .85em; transform-origin: 50% 100%; opacity: 0; will-change: transform, opacity; }
.text small { display: block; font-size: .5em; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; opacity: .7; margin-bottom: 3px; }
/* glass bubbles, a little less see-through; the owner's (the one texting) in their own colour, Ben's always grey
   (Ben, 2026-10-26). --owner is set per person by the script */
.text--owner, .text--ben { color: var(--paper); text-shadow: 0 1px 3px rgba(0,0,0,.55); backdrop-filter: blur(8px) saturate(1.6); -webkit-backdrop-filter: blur(8px) saturate(1.6);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(255,255,255,.15), inset 0 0 18px rgba(255,255,255,.08), 0 14px 34px rgba(0,0,0,.35); }
.text--owner { background: linear-gradient(135deg, color-mix(in srgb, var(--owner) 86%, transparent), color-mix(in srgb, var(--owner) 62%, transparent) 60%, color-mix(in srgb, var(--owner) 76%, transparent));
  border: 1px solid color-mix(in srgb, var(--owner) 45%, white); border-bottom-right-radius: 6px; margin-left: 1.2em; }
.text--ben { background: linear-gradient(135deg, rgba(150,150,160,.7), rgba(95,95,105,.55) 60%, rgba(130,130,140,.65)); border: 1px solid rgba(255,255,255,.45);
  border-bottom-left-radius: 6px; justify-self: start; }
/* typing dots: the owner's at the start of each scene (right, their colour), Ben's before his reply (left, grey); no
   name, three dots dancing in place (moved by the script) */
.text--typing { position: absolute; bottom: 0; display: flex; align-items: center; gap: .2em; padding: .6em .75em; }
.text--ben.text--typing { left: 0; }
.text--owner.text--typing { right: 0; margin: 0; }
.text--typing i { width: .3em; height: .3em; border-radius: 50%; background: currentColor; opacity: .85; }

/* the handwritten note naming the business, right above the headline, no arrow; it writes on as each person appears and
   stays until the next (Ben, 2026-10-26); it links to the page of every kind of business */
.note { display: inline-block; margin-bottom: .1em; color: var(--paper); text-decoration: none; white-space: nowrap; transform: rotate(-4deg); transform-origin: 0 100%; text-shadow: 0 2px 14px rgba(0,0,0,.7); opacity: 0; }
/* right above the headline (Ben, 2026-10-26): first at half its size, then "like 50% larger" (3.8vw against the
   title's 4.2vw; Caveat's letters run much smaller than Unbounded's, so it still reads smaller than the headline) */
.note__text { display: inline-block; font-family: var(--hand); white-space: nowrap; font-weight: 700; font-size: clamp(1.9rem, 3.8vw, 3.7rem); line-height: 1; clip-path: inset(-20% 100% -20% 0); }
.note:hover .note__text { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }

/* test controls, not part of the design */
.controls { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px; max-width: calc(100vw - 24px); background: rgba(20,20,24,.82); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; font: 600 13px/1 var(--body); backdrop-filter: blur(8px); }
.controls button { font: inherit; color: rgba(255,255,255,.8); background: transparent; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.controls button[aria-pressed="true"] { color: var(--ink); background: var(--lime); border-color: var(--lime); }
.controls .sep { width: 1px; height: 22px; background: rgba(255,255,255,.18); margin: 0 4px; }
.controls kbd { font: 600 11px/1 var(--body); opacity: .55; margin-left: 4px; }
.hide-controls .controls { display: none; }

/* phones: the video sits on top at a square, so it shows much more of the scene; the words go underneath */
@media (max-width: 760px) {
  :root { --promo-h: 40px; }
  .promo { height: auto; min-height: var(--promo-h); padding: 8px 16px; font-size: .84rem; gap: 4px 8px; justify-content: flex-start; flex-wrap: wrap; white-space: normal; }
  .promo__regular { display: none; }
  .hero { height: auto; min-height: 0; overflow: visible; }
  .hero__frame { position: relative; inset: auto; aspect-ratio: 1 / 1; overflow: hidden; }
  .hero__zoom { background-position: 50% 50%; }
  .hero__video { object-position: 50% 50%; }
  .hero::before { display: none; }
  .hero__frame::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(0deg, var(--ink) 0%, rgba(14,14,14,0) 28%), linear-gradient(180deg, rgba(8,6,10,.55) 0%, rgba(8,6,10,0) 26%); }
  .bar { padding-top: 18px; }
  .bar__logo { height: 26px; }
  .pitch { position: relative; left: auto; bottom: auto; width: auto; padding: 4px 16px 110px; }
  .pitch__title { font-size: clamp(1.8rem, 8vw, 2.4rem); }
  .pitch__sub { margin-top: 14px; font-size: 1.15rem; }
  .button { margin-top: 22px; }
  .texts { max-width: 86vw; }
  .text { font-size: 1.3rem; }
  .texts { --gap: 12px; }
  .note__text { font-size: clamp(1.6rem, 7.2vw, 2.1rem); }
  .controls { left: 8px; right: 8px; bottom: 8px; transform: none; max-width: none; flex-wrap: nowrap; overflow-x: auto; gap: 4px; padding: 6px; }
  .controls button { padding: 7px 8px; white-space: nowrap; }
  .controls kbd, .controls .long { display: none; }
}
@media (prefers-reduced-motion: reduce) { .promo__spot i { animation: none; } }
</style>
</head>
<body>
<p class="promo" id="promo"><span class="promo__tag">PROMO</span><span>Next applicant: $0 setup and $0/mo, upon acceptance.</span><span class="promo__spot"><i aria-hidden="true"></i>1 spot open</span><span class="promo__regular">Regular $199 setup + $99/mo</span></p>
<section class="hero">
  <div class="hero__frame" id="frame">
    <div class="hero__zoom" id="zoom"><video class="hero__video" id="video" src="hero-reel.mp4" poster="poster.jpg" autoplay muted loop playsinline></video></div>
  </div>
  <div class="texts" id="texts" aria-hidden="true">
    <p class="text text--owner" id="ask"></p>
    <p class="text text--ben" id="reply"><small>Ben</small><span></span></p>
    <p class="text text--ben text--typing" id="typing"><i></i><i></i><i></i></p>
    <p class="text text--owner text--typing" id="owner-typing"><i></i><i></i><i></i></p>
  </div>
  <header class="bar">
    <img class="bar__logo" src="logo-light.svg" alt="Web Design Wife">
    <span class="bar__menu" aria-hidden="true"><i></i><i></i><i></i></span>
  </header>
  <div class="pitch">
    <a class="note" id="note" href="#"><span class="note__text"></span></a>
    <h1 class="pitch__title" id="title"></h1>
    <p class="pitch__sub" id="sub"></p>
    <a class="button" href="#">Schedule a Call</a>
  </div>
</section>

<nav class="controls" id="controls" aria-label="Headline options"></nav>

<script>
// One idea, six ways (Ben, 2026-10-25): a website that lets them focus on running their business. One short sentence each.
const LINES = [
  { title: "You run the business, I'll handle the website.", sub: "Text me any change and it's live by the next business day." },
  { title: "Focus on your business, not your website.", sub: "Text a change and it's live the next business day. Hosting, backups and Google are covered." },
  { title: "Your website, handled, so you can run your business.", sub: "Text me a change and it's done by the next business day." },
  { title: "Spend your time on customers, not your website.", sub: "Changes by text, live the next business day, and the rest kept up for you." },
  { title: "Get back to running your business.", sub: "Your website is designed, updated and looked after, one text away." },
  { title: "Your business needs you more than your website does.", sub: "So I look after it. Text me a change and it's live the next business day." },
];

// Each person in the loop (about 10 s each, Ben 2026-10-25): when they're on screen (seconds in the reel), where their
// phone is in the frame (0–1), their colour, their business, what they text, and when (seconds after they appear):
// owner's typing dots from the start, their text, Ben's typing dots, Ben's reply. The first person keeps Ben's slower
// timing (the visitor is still taking in the site); the second and third come in sooner (Ben, 2026-10-26).
const PEOPLE = [
  { from: 0.0, to: 10.38, phone: [0.55, 0.61], color: "#4a3be8", note: "for pharmacies",
    ask: "Can you add\nflu shot hours?", reply: "On it.", at: { ask: 4, typing: 6, reply: 8 } },
  { from: 10.98, to: 21.37, phone: [0.545, 0.61], color: "#e2378a", note: "for cafés",
    ask: "Closing early tonight.", reply: "Got it,\nwill update the site.", at: { ask: 2, typing: 3.5, reply: 5 } },
  { from: 21.97, to: 32.35, phone: [0.57, 0.64], color: "#169b4f", note: "for electricians",
    ask: "Can you add\nSaturday hours?", reply: "Will do.", at: { ask: 2, typing: 3.5, reply: 5 } },
];
const MORE = " + 17 more"; // the other kinds of business on businesses.html (18 in all)
const ALL_BUSINESSES = "../Website/businesses.html";
const REEL = 32.96; // the loop's length; after the last person it crossfades back to the first
const NOTE_AFTER = 0.15, OWNER_TYPING_AFTER = 0.4, FADE = 0.6; // the texts fade out with the crossfade (Ben)
const TILT = "rotateY(16deg) rotateX(6deg)", SLIDE = 44; // tilted the other way (Ben); px each text slides up
// the slow zoom: from scale `from` to `to` over each person, their phone moving from `at` to `end` (0–1 of the frame),
// so the person sits further right and the shot closes in on the phone
const ZOOM = { desktop: { from: 1.18, to: 1.55, at: [0.62, 0.6], end: [0.6, 0.6] },
               phone: { from: 1, to: 1.25, at: null } }; // phones: no shift, a gentle zoom on the phone where it is

const LINE_KEYS = ["1", "2", "3", "4", "5", "6"]; // left hand: 1–6 pick the line, P shows or hides the promotion, H hides this bar
let line = 0;
const video = document.getElementById("video"), frame = document.getElementById("frame"), zoomEl = document.getElementById("zoom");
const texts = document.getElementById("texts"), ask = document.getElementById("ask"), reply = document.getElementById("reply");
const typing = document.getElementById("typing"), ownerTyping = document.getElementById("owner-typing");
const dots = [...typing.querySelectorAll("i"), ...ownerTyping.querySelectorAll("i")];
const note = document.getElementById("note"), noteText = note.querySelector(".note__text");
const pitch = document.querySelector(".pitch");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const phone = matchMedia("(max-width: 760px)");

function readHash() {
  const m = location.hash.match(/l=(\d)/);
  if (m) line = Math.min(+m[1], LINES.length - 1);
  document.body.classList.toggle("no-promo", /promo=0/.test(location.hash));
}

function render() {
  document.getElementById("title").textContent = LINES[line].title;
  document.getElementById("sub").textContent = LINES[line].sub;
  const on = (c) => document.body.classList.contains(c);
  history.replaceState(null, "", `${location.search}#l=${line}${on("no-promo") ? "&promo=0" : ""}`);
  const bar = document.getElementById("controls");
  bar.innerHTML = "";
  LINES.forEach((_, i) => bar.append(button(`<span class="long">Line </span>${i + 1}`, LINE_KEYS[i], i === line, () => { line = i; render(); })));
  const sep = document.createElement("span"); sep.className = "sep"; bar.append(sep);
  bar.append(button("Promo", "P", !on("no-promo"), togglePromo));
}

function button(label, key, pressed, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.setAttribute("aria-pressed", pressed);
  b.innerHTML = `${label}<kbd>${key}</kbd>`;
  b.addEventListener("click", onClick);
  return b;
}

function togglePromo() { document.body.classList.toggle("no-promo"); render(); anchor = null; show(lastT); }

// Where a point of the video (0–1) sits in the frame before the zoom, with object-fit: cover and its object-position
function inFrame([fx, fy]) {
  const W = frame.offsetWidth, H = frame.offsetHeight, vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const scale = Math.max(W / vw, H / vh);
  const [px, py] = getComputedStyle(video).objectPosition.split(" ").map((v) => parseFloat(v) / 100);
  return [(W - vw * scale) * px + fx * vw * scale, (H - vh * scale) * py + fy * vh * scale];
}
// ...and where it lands in the hero, zoom included
let zoom = { s: 1, tx: 0, ty: 0 };
function onScreen(pt) {
  const [x, y] = inFrame(pt);
  return [frame.offsetLeft + x * zoom.s + zoom.tx, frame.offsetTop + y * zoom.s + zoom.ty];
}

const clamp = (v) => Math.min(1, Math.max(0, v));
const easeOut = (p) => 1 - (1 - p) ** 3;
const easeInOut = (p) => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2);
const lerp = (a, b, w) => a + (b - a) * w;

// The zoom for person i at u (0–1 through their time): their phone held at a point that drifts from `at` to `end`
function zoomFor(i, u) {
  const z = phone.matches ? ZOOM.phone : ZOOM.desktop, e = still ? 0 : easeInOut(u);
  const W = frame.offsetWidth, H = frame.offsetHeight, s = lerp(z.from, z.to, e), [x, y] = inFrame(PEOPLE[i].phone);
  const [ox, oy] = z.at ? [lerp(z.at[0], z.end[0], e) * W, lerp(z.at[1], z.end[1], e) * H] : [x, y];
  const tx = ox - x * s, ty = oy - y * s;
  return { s, tx: Math.min(0, Math.max(W * (1 - s), tx)), ty: Math.min(0, Math.max(H * (1 - s), ty)) };
}
// At any moment: the current person's zoom, or, in a crossfade, a blend from the last person's end to the next one's start
function zoomAt(t) {
  const i = PEOPLE.findIndex((p) => t >= p.from && t < p.to);
  if (i >= 0) return zoomFor(i, (t - PEOPLE[i].from) / (PEOPLE[i].to - PEOPLE[i].from));
  const k = PEOPLE.findLastIndex((p) => t >= p.to), next = (k + 1) % PEOPLE.length;
  const nextFrom = next === 0 ? REEL : PEOPLE[next].from, w = easeInOut(clamp((t - PEOPLE[k].to) / (nextFrom - PEOPLE[k].to)));
  const a = zoomFor(k, 1), b = zoomFor(next, 0);
  return { s: lerp(a.s, b.s, w), tx: lerp(a.tx, b.tx, w), ty: lerp(a.ty, b.ty, w) };
}

// Where each person's texts sit, worked out once (where the phone is when their text sends) and then held still while the
// camera zooms (Ben, 2026-10-26: the bubbles shouldn't shake). Desktop: centred just above the phone, clear of the
// headline, the owner's text rising higher as the reply comes (Ben's markings). Phones: top left of the video, above the
// phone and left of the face.
let anchor = null;
function place(p, i) {
  if (!anchor) {
    const W = frame.offsetWidth, H = frame.offsetHeight, w = texts.offsetWidth, h = texts.offsetHeight;
    if (phone.matches) anchor = [12 + w / 2, frame.offsetTop + 64 + h];
    else {
      const live = zoom;
      zoom = zoomFor(i, p.at.ask / (p.to - p.from));
      const [x, y] = onScreen(p.phone);
      zoom = live;
      const cx = Math.min(Math.max(x, pitch.offsetLeft + pitch.offsetWidth + 24 + w / 2), frame.offsetLeft + W - 12 - w / 2);
      anchor = [cx, Math.min(y - H * 0.07, frame.offsetTop + H - 8)];
    }
    anchor = anchor.map(Math.round);
  }
  texts.style.left = `${anchor[0]}px`;
  texts.style.top = `${anchor[1]}px`;
}

// The motion, as a function of the reel's time t (so it is always in step with the picture). Each person runs from
// their start until the next one starts: in the crossfade their texts fade out with the picture, and their note stays
// until the next person's note writes on (Ben, 2026-10-26).
let current = -1, lastT = 0;
function show(t) {
  lastT = t;
  zoom = zoomAt(t);
  zoomEl.style.transform = `translate(${zoom.tx}px, ${zoom.ty}px) scale(${zoom.s})`;
  const i = PEOPLE.findLastIndex((p) => t >= p.from);
  const p = PEOPLE[i];
  if (i !== current) {
    current = i;
    anchor = null;
    ask.textContent = p.ask; reply.lastChild.textContent = p.reply;
    noteText.textContent = p.note + MORE; note.href = ALL_BUSINESSES;
    texts.style.setProperty("--owner", p.color);
  }
  place(p, i);
  const gap = parseFloat(getComputedStyle(texts).getPropertyValue("--gap"));
  const out = still ? 0 : clamp((t - p.to) / FADE), keep = 1 - out;
  const at = (after, dur) => (still ? (t >= p.from + after ? 1 : 0) : clamp((t - p.from - after) / dur));

  // the note writes on from the left as the person appears and stays until the next one
  const n = at(NOTE_AFTER, 1);
  note.style.opacity = n > 0 ? 1 : 0;
  noteText.style.clipPath = `inset(-20% ${100 - 105 * easeOut(n)}% -20% 0)`;

  // the owner's typing dots from the start of the scene; their text slides up and takes their place, sitting low where
  // the reply will be; Ben's dots nudge it up, then his reply pushes it the rest of the way (Ben, 2026-10-25/26)
  const ot = at(OWNER_TYPING_AFTER, 0.5), a = at(p.at.ask, 0.75), ty = at(p.at.typing, 0.5), r = at(p.at.reply, 0.6);
  const slot = (typing.offsetHeight + gap) * easeOut(ty) + (reply.offsetHeight - typing.offsetHeight) * easeOut(r);
  const slide = (el, p, extra) => {
    el.style.opacity = clamp(p / 0.6) * keep;
    el.style.transform = `translateY(${SLIDE * (1 - easeOut(p)) + extra - 18 * out}px) ${TILT}`;
  };
  slide(ask, a, reply.offsetHeight + gap - slot);
  slide(reply, r, 0);
  ownerTyping.style.opacity = clamp(ot / 0.6) * (1 - clamp(a / 0.35)) * keep;
  ownerTyping.style.transform = `translateY(${SLIDE * 0.6 * (1 - easeOut(ot))}px) ${TILT}`;
  typing.style.opacity = clamp(ty / 0.6) * (1 - clamp(r / 0.35)) * keep;
  typing.style.transform = `translateY(${SLIDE * 0.6 * (1 - easeOut(ty))}px) ${TILT}`;
  dots.forEach((d, k) => { d.style.transform = `translateY(${-0.22 * Math.max(0, Math.sin((t - p.from) * Math.PI * 3.2 - (k % 3) * 0.7))}em)`; });
}

function tick() { show(video.currentTime); requestAnimationFrame(tick); }

// For recording frame by frame (_System/scripts/record-hero-test.mjs): ?frames=<folder> shows still frames of the
// reel instead of the video, and renderAt(t) draws the moment t exactly.
const frames = new URLSearchParams(location.search).get("frames");
window.renderAt = async (t) => {
  const src = `${frames}/${String(Math.round(t * 30) + 1).padStart(4, "0")}.jpg`;
  const img = new Image(); img.src = src; await img.decode();
  zoomEl.style.backgroundImage = `url("${src}")`;
  show(t);
  return true;
};

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (LINE_KEYS.includes(k)) { line = LINE_KEYS.indexOf(k); render(); }
  else if (k === "p") togglePromo();
  else if (k === "h") document.body.classList.toggle("hide-controls");
});
const reposition = () => { anchor = null; show(lastT); };
addEventListener("hashchange", () => { readHash(); render(); reposition(); });
addEventListener("resize", reposition);
phone.addEventListener("change", reposition);
video.addEventListener("loadedmetadata", reposition);

readHash();
render();
if (frames) { video.style.visibility = "hidden"; video.pause(); document.body.classList.add("hide-controls"); }
else requestAnimationFrame(tick);
</script>
</body>
